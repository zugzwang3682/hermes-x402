name: x402
kind: standalone
version: 0.2.0
manifest_version: 2
description: "Pay x402 (HTTP 402) resources and x402 inference brokers in USDC from the agent's own wallet: /x402 topup, balance-funded models (with the x402-broker provider), hard spend limits, approval above a threshold."
author: Autumn Eight LLC
license: MIT
tags: [x402, payments, usdc, base, inference]
requires_hermes: ">=0.21.4"
provides_tools:
  - x402_inspect
  - x402_fetch
  - x402_wallets
provides_hooks:
  - pre_tool_call
optional_env:
  - X402_AUTO_APPROVE_USD
  - X402_SIGNER_URL
